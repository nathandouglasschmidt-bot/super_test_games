<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e30"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Pocket Rink</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101e30;color:#f5f4eb;font-family:system-ui,sans-serif}body{height:100dvh;display:grid;place-items:center;overscroll-behavior:none}main{width:min(100%,520px);height:100%;padding:max(8px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;background:radial-gradient(ellipse at center,#253b50,#101e30 80%)}header,.score,footer{display:flex;align-items:center;justify-content:space-between}h1,h2,strong,button{font-family:'Arial Narrow',system-ui,sans-serif;font-weight:900}h1{font-size:22px;font-style:italic;text-transform:uppercase;letter-spacing:-1.5px;margin:0}h1 i{color:#ff754f}button{cursor:pointer;color:inherit;border:1px solid #64758a;background:#223449;border-radius:8px;padding:10px 16px;touch-action:manipulation}button:disabled{opacity:.5}.score{border-block:1px solid #536478;padding:6px 3px;gap:10px;font-weight:800}.team{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1px}.team b{font-size:30px}.home{color:#86def5}.away{color:#ff9271}.clock{text-align:center;font-variant-numeric:tabular-nums}.clock small{display:block;font-size:9px;letter-spacing:2px;color:#bbcbd8}.arena{min-height:0;position:relative;display:grid;place-items:center}canvas{height:100%;width:100%;display:block;touch-action:none}article{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(82%,320px);padding:20px;background:#11253af5;border:1px solid #678298;border-top:4px solid #ff754f;border-radius:9px;box-shadow:0 8px 30px #07152755}article[hidden]{display:none}article small{color:#9edff1;font-weight:800;letter-spacing:2px;font-size:10px}h2{font-size:clamp(25px,6vw,36px);line-height:1;margin:8px 0;text-transform:uppercase;font-style:italic}p{color:#d2dee8;font-size:14px;line-height:1.45;margin:10px 0 14px}article button,#action{background:#ff754f;color:#17202b;border:0}footer{gap:8px}#stick{width:84px;height:84px;position:relative;border-radius:50%;background:radial-gradient(circle,#293f54,#192939);border:1px solid #586b7f;touch-action:none;display:grid;place-items:center}#knob{width:39px;height:39px;border-radius:50%;background:#7796ab;border:3px solid #a2bfd0;pointer-events:none}#status{text-align:center;color:#aac3d2;font-weight:bold;font-size:12px}#action{border-radius:50%;height:76px;width:76px;text-transform:uppercase;padding:0;box-shadow:inset 0 -5px 0 #a84432}button:active{filter:brightness(.88)}@media (orientation:landscape) and (max-height:580px){main{max-width:100%;width:100%;grid-template-columns:minmax(110px,1fr) minmax(180px,2fr) minmax(110px,1fr);grid-template-rows:auto 1fr}header{grid-column:1;display:grid;gap:10px}.score{grid-column:3;grid-row:1;flex-wrap:wrap}.arena{grid-column:2;grid-row:1/3}footer{grid-column:1/4;grid-row:2;align-self:end;pointer-events:none}footer>*{pointer-events:auto}#status{display:none}}
